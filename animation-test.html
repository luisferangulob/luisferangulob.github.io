<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Animation Test — Root → Brain → Medicine</title>

  <style>
    :root {
      --bg: #030b18;
      --panel: rgba(10, 18, 33, 0.9);
      --panel-border: rgba(75, 132, 230, 0.22);
      --grid: rgba(88, 160, 255, 0.08);
      --text: #e8eef9;
      --muted: rgba(232, 238, 249, 0.62);
      --accent: #59a8ff;
      --accent-soft: rgba(89, 168, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(88, 160, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88, 160, 255, 0.06) 1px, transparent 1px),
        radial-gradient(circle at top, rgba(19, 37, 74, 0.35), transparent 45%),
        var(--bg);
      background-size: 56px 56px, 56px 56px, auto, auto;
    }

    body {
      padding: 36px 24px 60px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .panel {
      background: linear-gradient(
        180deg,
        rgba(18, 25, 39, 0.96) 0%,
        rgba(8, 16, 30, 0.96) 100%
      );
      border: 1px solid var(--panel-border);
      border-radius: 34px;
      padding: 28px 28px 22px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 28px 60px rgba(0, 0, 0, 0.35);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .panel-head .loop {
      color: rgba(232, 238, 249, 0.45);
    }

    .canvas-shell {
      border: 1px solid rgba(75, 132, 230, 0.18);
      border-radius: 30px;
      background:
        radial-gradient(circle at center, rgba(16, 34, 70, 0.25), transparent 40%),
        #021126;
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: min(68vh, 780px);
    }

    .panel-foot {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .goal {
      margin: 0;
      max-width: 900px;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--muted);
    }

    .goal strong {
      color: var(--text);
      font-weight: 800;
    }

    .phase {
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 110px;
      text-align: right;
      padding-top: 4px;
    }

    @media (max-width: 900px) {
      body {
        padding: 22px 12px 32px;
      }

      .panel {
        padding: 18px 18px 18px;
        border-radius: 24px;
      }

      .canvas-shell {
        border-radius: 20px;
      }

      canvas {
        height: 520px;
      }

      .panel-foot {
        flex-direction: column;
      }

      .phase {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Standalone animation prototype</p>

    <section class="panel">
      <div class="panel-head">
        <span>Root → Brain → Medicine</span>
        <span class="loop">Continuous loop</span>
      </div>

      <div class="canvas-shell">
        <canvas id="conceptCanvas"></canvas>
      </div>

      <div class="panel-foot">
        <p class="goal">
          <strong>Goal:</strong> one branching structure grows downward from a seed,
          rotates into a lateral brain without rearranging, erases in place into one
          horizontal line, and that line becomes the ECG.
        </p>

        <div id="phaseLabel" class="phase">Growing</div>
      </div>
    </section>
  </main>

  <script defer src="animation-test.js?v=8"></script>
</body>
</html>
