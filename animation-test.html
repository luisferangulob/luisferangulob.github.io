                    W =

                            window.devicePixelRatio || 1
                        );


                    canvas.width =
                        Math.round(
                            W * DPR
                        );


                    canvas.height =
                        Math.round(
                            H * DPR
                        );


                    ctx.setTransform(
                        DPR,
                        0,
                        0,
                        DPR,
                        0,
                        0
                    );

                resize();

                    resize
                );


                function clamp(
                    value,
                    min = 0,
                    max = 1
                ) {

                    return Math.max(
                        min,
                        Math.min(
                            max,
                            value
                        )
                    );

                }


                function lerp(
                    a,
                    b,
                    t
                ) {

                    return (
                        a
                        +
                        (
                            b - a
                        )
                        * t
                    );

                }


                function ease(
                    t
                ) {

                    t =
                        clamp(t);


                    return (
                        t < 0.5
                            ?
                            4 * t * t * t

                            :

                            1
                            -
                            Math.pow(
                                -2 * t + 2,
                                3
                            )
                            / 2
                    );

                }


                function easeOut(
                    t
                ) {

                    t =
                        clamp(t);


                    return (
                        1
                        -
                        Math.pow(
                            1 - t,
                            3
                        )
                    );

                }


                function dist(
                    a,
                    b
                ) {

                    return Math.hypot(
                        b.x - a.x,
                        b.y - a.y
                    );

                }


                function stage() {

                    return {

                        cx:
                            W * 0.5,

                        cy:
                            H * 0.51,

                        s:
                            Math.min(
                                W,
                                H
                            )
                            * 0.30

                }


                function rotate(
                    point,
                    angle
                ) {

                    const cos =
                        Math.cos(angle);


                    const sin =
                        Math.sin(angle);


                    return {

                        x:
                            point.x * cos
                            -
                            point.y * sin,

                        y:
                            point.x * sin
                            +
                            point.y * cos

                    };

                }


                function screen(
                    point,
                    angle = 0
                ) {

                    const st =
                        stage();


                    const rotated =
                        rotate(
                            point,
                            angle
                        );

                            rotated.x

                        y:
                            st.cy

                            rotated.y

                    );

                        st.cy
                    );

                function branchEraseStart(
                    branch
                ) {

                    if (
                        branch.keep
                    ) {

                        return 1;

                    }


                    let maxX =
                        -Infinity;


                    for (
                        const point
                        of
                        branch.p
                    ) {

                        maxX =
                            Math.max(
                                maxX,
                                point.x
                            );

                    }


                    const normalized =
                        clamp(
                            (
                                maxX
                                +
                                1.05
                            )
                            /
                            2
                        );


                    return lerp(
                        0.02,
                        0.58,
                        1 - normalized
                    );

                }


                function pathLength(
                    points
                ) {

                    let length =
                        0;


                    for (
                        let i = 1;
                        i < points.length;
                        i++
                    ) {

                        length +=
                            dist(
                                points[i - 1],
                                points[i]
                            );

                    }


                    return length;

                }


                function drawPartial(
                    points,
                    amount,
                    angle,
                    color,
                    lineWidth,
                    alpha = 1
                ) {

                    amount =
                        clamp(amount);


                    if (
                        amount <= 0
                        ||
                        points.length < 2
                    ) {

                        return;

                    }


                    const total =
                        pathLength(
                            points
                        );


                    const target =
                        total
                        *
                        amount;


                    ctx.save();


                    ctx.globalAlpha =
                        alpha;


                    ctx.strokeStyle =
                        color;


                    ctx.lineWidth =
                        lineWidth;


                    ctx.lineCap =
                        "round";


                    ctx.lineJoin =
                        "round";


                    const first =
                        screen(
                            points[0],
                            angle
                        );


                    ctx.beginPath();


                    ctx.moveTo(
                        first.x,
                        first.y
                    );


                    let walked =
                        0;


                    for (
                        let i = 1;
                        i < points.length;
                        i++
                    ) {

                        const a =
                            points[i - 1];


                        const b =
                            points[i];


                        const segment =
                            dist(
                                a,
                                b
                            );


                        if (
                            walked
                            +
                            segment
                            <=
                            target
                        ) {

                            const q =
                                screen(
                                    b,
                                    angle
                                );


                            ctx.lineTo(
                                q.x,
                                q.y
                            );


                            walked +=
                                segment;

                        }

                        else {

                            const remaining =
                                target
                                -
                                walked;


                            const ratio =
                                segment <= 0
                                    ?
                                    0
                                    :
                                    remaining / segment;


                            const partial = {

                                x:
                                    lerp(
                                        a.x,
                                        b.x,
                                        ratio
                                    ),

                                y:
                                    lerp(
                                        a.y,
                                        b.y,
                                        ratio
                                    )

                            };


                            const q =
                                screen(
                                    partial,
                                    angle
                                );


                            ctx.lineTo(
                                q.x,
                                q.y
                            );


                            break;

                        }

                    }


                    ctx.stroke();


                    ctx.restore();

                }


                const ROOT_ANGLE =
                    Math.PI / 2;


                const SEED = {

                    x:
                        -1.02,

                    y:
                        0

                };


                function drawSeed(
                    angle,
                    alpha = 1,
                    radius = 13
                ) {

                    const q =
                        screen(
                            SEED,
                            angle
                        );


                    ctx.save();


                    ctx.globalAlpha =
                        alpha;


                    const gradient =
                        ctx.createRadialGradient(
                            q.x,
                            q.y,
                            0,
                            q.x,
                            q.y,
                            42
                        );


                    gradient.addColorStop(
                        0,
                        "rgba(244,138,75,.50)"
                    );


                    gradient.addColorStop(
                        1,
                        "rgba(244,138,75,0)"
                    );


                    ctx.fillStyle =
                        gradient;


                    ctx.beginPath();


                    ctx.arc(
                        q.x,
                        q.y,
                        42,
                        0,
                        Math.PI * 2
                    );


                    ctx.fill();


                    ctx.fillStyle =
                        C.orange;


                    ctx.beginPath();


                    ctx.arc(
                        q.x,
                        q.y,
                        radius,
                        0,
                        Math.PI * 2
                    );


                    ctx.fill();


                    ctx.strokeStyle =
                        "rgba(244,138,75,.50)";


                    ctx.lineWidth =
                        2;


                    ctx.beginPath();


                    ctx.arc(
                        q.x,
                        q.y,
                        radius + 8,
                        0,
                        Math.PI * 2
                    );


                    ctx.stroke();


                    ctx.restore();

                }


                function drawGrowingRoot(
                    growth
                ) {

                    drawSeed(
                        ROOT_ANGLE,
                        1
                    );


                    for (
                        const branch
                        of
                        branches
                    ) {

                        const local =
                            clamp(
                                (
                                    growth
                                    -
                                    branch.gs
                                )
                                /
                                Math.max(
                                    0.001,
                                    branch.ge
                                    -
                                    branch.gs
                                )
                            );


                        drawPartial(
                            branch.p,
                            local,
                            ROOT_ANGLE,
                            branch.color,
                            branch.w,
                            1
                        );

                    }

                }


                function drawComplete(
                    angle,
                    alpha = 1
                ) {

                    for (
                        const branch
                        of
                        branches
                    ) {

                        drawPartial(
                            branch.p,
                            1,
                            angle,
                            branch.color,
                            branch.w,
                            alpha
                        );

                    }

                }


                function drawErasingBrain(
                    erase
                ) {

                    for (
                        const branch
                        of
                        branches
                    ) {

                        if (
                            branch.keep
                        ) {

                            continue;

                        }


                        const start =
                            branchEraseStart(
                                branch
                            );


                        const local =
                            clamp(
                                (
                                    erase
                                    -
                                    start
                                )
                                /
                                0.34
                            );


                        const visible =
                            1
                            -
                            easeOut(
                                local
                            );


                        if (
                            visible > 0.002
                        ) {

                            drawPartial(
                                branch.p,
                                visible,
                                0,
                                branch.color,
                                branch.w,
                                Math.min(
                                    1,
                                    visible * 1.4
                                )
                            );

                        }

                    }


                    const trunk =
                        branches[0];


                    drawPartial(
                        trunk.p,
                        1,
                        0,
                        C.pale,
                        4.2,
                        1
                    );

                }


                function drawStraighteningLine(
                    progress
                ) {

                    const trunk =
                        branches[0].p;


                    drawPartial(
                        trunk,
                        1,
                        0,
                        C.pale,
                        4.2,
                        1 - progress
                    );


                    const a =
                        screen(
                            {
                                x:
                                    -1.02,

                                y:
                                    0
                            },
                            0
                        );


                    const b =
                        screen(
                            {
                                x:
                                    0.94,

                                y:
                                    0
                            },
                            0
                        );


                    ctx.save();


                    ctx.strokeStyle =
                        C.pale;


                    ctx.lineWidth =
                        4.2;


                    ctx.lineCap =
                        "round";


                    ctx.beginPath();


                    ctx.moveTo(
                        a.x,
                        a.y
                    );


                    ctx.lineTo(
                        lerp(
                            a.x,
                            b.x,
                            progress
                        ),

                        lerp(
                            a.y,
                            b.y,
                            progress
                        )
                    );


                    ctx.stroke();


                    ctx.restore();

                }


                function drawScreenPath(
                    points,
                    progress,
                    color,
                    lineWidth,
                    alpha = 1
                ) {

                    progress =
                        clamp(progress);


                    if (
                        progress <= 0
                    ) {

                        return;

                    }


                    let total =
                        0;


                    for (
                        let i = 1;
                        i < points.length;
                        i++
                    ) {

                        total +=
                            dist(
                                points[i - 1],
                                points[i]
                            );

                    }


                    const target =
                        total
                        *
                        progress;


                    let walked =
                        0;


                    ctx.save();


                    ctx.globalAlpha =
                        alpha;


                    ctx.strokeStyle =
                        color;


                    ctx.lineWidth =
                        lineWidth;


                    ctx.lineCap =
                        "round";


                    ctx.lineJoin =
                        "round";


                    ctx.beginPath();


                    ctx.moveTo(
                        points[0].x,
                        points[0].y
                    );


                    for (
                        let i = 1;
                        i < points.length;
                        i++
                    ) {

                        const a =
                            points[i - 1];


                        const b =
                            points[i];


                        const segment =
                            dist(
                                a,
                                b
                            );


                        if (
                            walked
                            +
                            segment
                            <=
                            target
                        ) {

                            ctx.lineTo(
                                b.x,
                                b.y
                            );


                            walked +=
                                segment;

                        }

                        else {

                            const ratio =
                                segment <= 0
                                    ?
                                    0
                                    :
                                    (
                                        target
                                        -
                                        walked
                                    )
                                    /
                                    segment;


                            ctx.lineTo(
                                lerp(
                                    a.x,
                                    b.x,
                                    ratio
                                ),

                                lerp(
                                    a.y,
                                    b.y,
                                    ratio
                                )
                            );


                            break;

                        }

                    }


                    ctx.stroke();


                    ctx.restore();

                }


                function heartPoints(
                    cx,
                    cy,
                    size
                ) {

                    const output =
                        [];


                    for (
                        let i = 0;
                        i <= 100;
                        i++
                    ) {

                        const t =
                            i
                            /
                            100
                            *
                            Math.PI
                            *
                            2;


                        const x =
                            16
                            *
                            Math.pow(
                                Math.sin(t),
                                3
                            );


                        const y =
                            -(
                                13
                                *
                                Math.cos(t)

                                -

                                5
                                *
                                Math.cos(
                                    2 * t
                                )

                                -

                                2
                                *
                                Math.cos(
                                    3 * t
                                )

                                -

                                Math.cos(
                                    4 * t
                                )
                            );


                        output.push({

                            x:
                                cx
                                +
                                x
                                *
                                size
                                /
                                18,

                            y:
                                cy
                                +
                                y
                                *
                                size
                                /
                                18

                        });

                    }


                    return output;

                }


                function drawECG(
                    progress
                ) {

                    const st =
                        stage();


                    const y =
                        st.cy;


                    const s =
                        st.s;


                    const x0 =
                        st.cx
                        -
                        1.02
                        *
                        s;


                    const points = [

                        {
                            x:
                                x0,

                            y
                        },

                        {
                            x:
                                st.cx
                                -
                                0.56 * s,

                            y
                        },

                        {
                            x:
                                st.cx
                                -
                                0.32 * s,

                            y
                        },

                        {
                            x:
                                st.cx
                                -
                                0.15 * s,

                            y
                        },

                        {
                            x:
                                st.cx
                                -
                                0.08 * s,

                            y:
                                y
                                -
                                0.12 * s
                        },

                        {
                            x:
                                st.cx
                                -
                                0.01 * s,

                            y:
                                y
                                +
                                0.19 * s
                        },

                        {
                            x:
                                st.cx
                                +
                                0.07 * s,

                            y:
                                y
                                -
                                0.34 * s
                        },

                        {
                            x:
                                st.cx
                                +
                                0.17 * s,

                            y:
                                y
                                +
                                0.22 * s
                        },

                        {
                            x:
                                st.cx
                                +
                                0.30 * s,

                            y
                        },

                        {
                            x:
                                st.cx
                                +
                                0.55 * s,

                            y
                        },

                        {
                            x:
                                st.cx
                                +
                                0.78 * s,

                            y
                        }

                    ];


                    drawScreenPath(
                        points,
                        clamp(
                            progress
                            /
                            0.68
                        ),
                        C.pale,
                        4.3
                    );


                    if (
                        progress > 0.50
                    ) {

                        const heartProgress =
                            clamp(
                                (
                                    progress
                                    -
                                    0.50
                                )
                                /
                                0.34
                            );


                        const heart =
                            heartPoints(
                                st.cx
                                +
                                0.82 * s,

                                y - 2,

                                0.18 * s
                            );


                        drawScreenPath(
                            heart,
                            heartProgress,
                            C.pink,
                            3.8
                        );


                        if (
                            heartProgress > 0.97
                        ) {

                            const beat =
                                (
                                    Math.sin(
                                        performance.now()
                                        *
                                        0.018
                                    )
                                    +
                                    1
                                )
                                /
                                2;


                            ctx.save();


                            ctx.shadowColor =
                                C.pink;


                            ctx.shadowBlur =
                                8
                                +
                                beat
                                *
                                12;


                            drawScreenPath(
                                heart,
                                1,
                                C.pink,
                                3.8,
                                0.78
                                +
                                beat
                                *
                                0.22
                            );


                            ctx.restore();

                        }

                    }

                }


                function drawRetractToSeed(
                    progress
                ) {

                    const st =
                        stage();


                    const y =
                        st.cy;


                    const s =
                        st.s;


                    const left =
                        st.cx
                        -
                        1.02
                        *
                        s;


                    const right =
                        lerp(
                            st.cx
                            +
                            0.78
                            *
                            s,

                            left,

                            ease(
                                progress
                            )
                        );


                    ctx.save();


                    ctx.strokeStyle =
                        C.pale;


                    ctx.lineWidth =
                        4.2;


                    ctx.lineCap =
                        "round";


                    ctx.beginPath();


                    ctx.moveTo(
                        left,
                        y
                    );


                    ctx.lineTo(
                        right,
                        y
                    );


                    ctx.stroke();


                    ctx.restore();


                    if (
                        progress > 0.42
                    ) {

                        const alpha =
                            clamp(
                                (
                                    progress
                                    -
                                    0.42
                                )
                                /
                                0.58
                            );


                        ctx.save();


                        ctx.globalAlpha =
                            alpha;


                        const gradient =
                            ctx.createRadialGradient(
                                left,
                                y,
                                0,
                                left,
                                y,
                                38
                            );


                        gradient.addColorStop(
                            0,
                            "rgba(244,138,75,.45)"
                        );


                        gradient.addColorStop(
                            1,
                            "rgba(244,138,75,0)"
                        );


                        ctx.fillStyle =
                            gradient;


                        ctx.beginPath();


                        ctx.arc(
                            left,
                            y,
                            38,
                            0,
                            Math.PI * 2
                        );


                        ctx.fill();


                        ctx.fillStyle =
                            C.orange;


                        ctx.beginPath();


                        ctx.arc(
                            left,
                            y,
                            12,
                            0,
                            Math.PI * 2
                        );


                        ctx.fill();


                        ctx.restore();

                    }

                }


                function drawSeedResetRotation(
                    progress
                ) {

                    const angle =
                        lerp(
                            0,
                            ROOT_ANGLE,
                            ease(
                                progress
                            )
                        );


                    drawSeed(
                        angle,
                        1,
                        12
                    );

                }


                const DURATION =
                    22000;


                const start =
                    performance.now();


                function frame(
                    now
                ) {

                    ctx.clearRect(
                        0,
                        0,
                        W,
                        H
                    );


                    drawGuides();


                    const t =
                        (
                            (
                                now
                                -
                                start
                            )
                            %
                            DURATION
                        )
                        /
                        DURATION;


                    if (
                        t < 0.34
                    ) {

                        status.textContent =
                            "GROWING";


                        drawGrowingRoot(
                            easeOut(
                                t
                                /
                                0.34
                            )
                        );

                    }


                    else if (
                        t < 0.41
                    ) {

                        status.textContent =
                            "ROOT";


                        drawGrowingRoot(
                            1
                        );

                    }


                    else if (
                        t < 0.52
                    ) {

                        status.textContent =
                            "ROTATING";


                        const progress =
                            ease(
                                (
                                    t
                                    -
                                    0.41
                                )
                                /
                                0.11
                            );


                        const angle =
                            lerp(
                                ROOT_ANGLE,
                                0,
                                progress
                            );


                        drawComplete(
                            angle,
                            1
                        );


                        drawSeed(
                            angle,
                            1
                            -
                            progress
                            *
                            0.88
                        );

                    }


                    else if (
                        t < 0.61
                    ) {

                        status.textContent =
                            "BRAIN";


                        drawComplete(
                            0,
                            1
                        );

                    }


                    else if (
                        t < 0.75
                    ) {

                        status.textContent =
                            "ERASING";


                        drawErasingBrain(
                            ease(
                                (
                                    t
                                    -
                                    0.61
                                )
                                /
                                0.14
                            )
                        );

                    }


                    else if (
                        t < 0.79
                    ) {

                        status.textContent =
                            "LINE";


                        drawStraighteningLine(
                            ease(
                                (
                                    t
                                    -
                                    0.75
                                )
                                /
                                0.04
                            )
                        );

                    }


                    else if (
                        t < 0.91
                    ) {

                        status.textContent =
                            "PULSE";


                        drawECG(
                            easeOut(
                                (
                                    t
                                    -
                                    0.79
                                )
                                /
                                0.12
                            )
                        );

                    }


                    else if (
                        t < 0.97
                    ) {

                        status.textContent =
                            "RENEW";


                        drawRetractToSeed(
                            ease(
                                (
                                    t
                                    -
                                    0.91
                                )
                                /
                                0.06
                            )
                        );

                    }


                    else {

                        status.textContent =
                            "RESET";


                        drawSeedResetRotation(
                            (
                                t
                                -
                                0.97
                            )
                            /
                            0.03
                        );

                    }


                    requestAnimationFrame(
                        frame
                    );

                }


                status.textContent =
                    "GROWING";


                requestAnimationFrame(
                    frame
                );

            }
        );

    </script>

</body>
