<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animation Test — Luis Fernando Angulo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;

            background-color: #0d1117;

            background-image:
                linear-gradient(
                    rgba(88, 166, 255, 0.06) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(88, 166, 255, 0.06) 1px,
                    transparent 1px
                );

            background-size: 64px 64px;

            color: #f0f6fc;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
        }


        .test-shell {
            width: min(760px, 94vw);
        }


        .test-label {
            margin: 0 0 16px;

            color: #58a6ff;

            font-family: monospace;

            font-size: 0.78rem;
            font-weight: 700;

            letter-spacing: 0.14em;
            text-transform: uppercase;
        }


        .animation-card {
            width: 100%;

            padding: 24px;

            border: 1px solid rgba(88, 166, 255, 0.25);
            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(22, 27, 34, 0.97),
                    rgba(13, 17, 23, 0.92)
                );

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.38);
        }


        .animation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 18px;
        }


        .animation-header span {
            font-family: monospace;

            font-size: 0.72rem;
            font-weight: 700;

            letter-spacing: 0.13em;
            text-transform: uppercase;
        }


        .animation-header span:first-child {
            color: #58a6ff;
        }


        .animation-header span:last-child {
            color: #6e7681;
        }


        .canvas-frame {
            position: relative;

            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;

            border: 1px solid rgba(88, 166, 255, 0.18);
            border-radius: 22px;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(88, 166, 255, 0.055),
                    transparent 47%
                ),
                #090f18;
        }


        canvas {
            width: 100%;
            height: 100%;

            display: block;
        }


        .animation-footer {
            display: flex;
            justify-content: space-between;

            gap: 20px;

            margin-top: 18px;
        }


        .animation-footer p {
            margin: 0;

            color: #8b949e;

            font-size: 0.84rem;
            line-height: 1.6;
        }


        .animation-footer strong {
            color: #c9d1d9;
        }


        .animation-footer .status {
            flex-shrink: 0;

            color: #58a6ff;

            font-family: monospace;

            font-size: 0.72rem;

            letter-spacing: 0.08em;
        }


        @media (max-width: 600px) {

            .animation-card {
                padding: 16px;
            }

            .animation-header {
                align-items: flex-start;
                flex-direction: column;

                gap: 5px;
            }

            .animation-footer {
                flex-direction: column;
            }

        }

    </style>
</head>


<body>

    <main class="test-shell">

        <p class="test-label">
            Standalone animation prototype
        </p>

        <div class="animation-card">

            <div class="animation-header">

                <span>
                    Root → Brain → Medicine
                </span>

                <span>
                    Continuous Loop
                </span>

            </div>


            <div class="canvas-frame">

                <canvas id="journeyCanvas"></canvas>

            </div>


            <div class="animation-footer">

                <p>
                    <strong>Goal:</strong>
                    one structure continuously transforms from a growing root
                    into a lateral brain, then into an ECG signal and finally
                    back into the same seed.
                </p>

                <span class="status" id="animationStatus">
                    GROWING
                </span>

            </div>

        </div>

    </main>


    <script src="animation-test.js?v=1"></script>

</body>

</html>
