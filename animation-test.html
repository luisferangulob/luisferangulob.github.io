            /*
            ============================================================
            BASIC HELPERS
            ============================================================
            */


            function clamp(
                value,
                min = 0,
                max = 1
            ) {

                return Math.max(
                    min,
                    Math.min(
                        max,
                        value
                    )
                );

            }


            function lerp(
                a,
                b,
                t
            ) {

                return (
                    a
                    +
                    (
                        b - a
                    )
                    * t
                );

            }


            function easeInOut(
                t
            ) {

                t =
                    clamp(t);


                return (
                    t < 0.5

                        ?

                        4
                        *
                        t
                        *
                        t
                        *
                        t

                        :

                        1
                        -
                        Math.pow(
                            -2 * t + 2,
                            3
                        )
                        /
                        2
                );

            }


            function easeOut(
                t
            ) {

                t =
                    clamp(t);


                return (
                    1
                    -
                    Math.pow(
                        1 - t,
                        3
                    )
                );

            }


            function resizeCanvas() {

                const rect =
                    canvas.getBoundingClientRect();


                width =
                    rect.width;


                height =
                    rect.height;


                const dpr =
                    window.devicePixelRatio || 1;


                canvas.width =
                    Math.round(
                        width * dpr
                    );


                canvas.height =
                    Math.round(
                        height * dpr
                    );


                /*
                We now draw using CSS pixels.

                This removes the old
                device-pixel coordinate ambiguity.
                */

                ctx.setTransform(
                    dpr,
                    0,
                    0,
                    dpr,
                    0,
                    0
                );

            }


            resizeCanvas();


            window.addEventListener(
                "resize",
                resizeCanvas
            );


            /*
            ============================================================
            COORDINATE SYSTEM
            ============================================================
            */


            function scale() {

                return (
                    Math.min(
                        width,
                        height
                    )
                    *
                    0.39
                );

            }


            function toScreen(
                point
            ) {

                const s =
                    scale();


                return {

                    x:
                        width / 2
                        +
                        point.x
                        *
                        s,

                    y:
                        height / 2
                        +
                        point.y
                        *
                        s

                };

            }


            function rotatePoint(
                point,
                angle
            ) {

                const c =
                    Math.cos(angle);


                const s =
                    Math.sin(angle);


                return {

                    x:
                        point.x * c
                        -
                        point.y * s,

                    y:
                        point.x * s
                        +
                        point.y * c

                };

            }

            ============================================================
            STRUCTURE

            Brain:
            angle = 0.

            SAME EXACT PATHS.
            ============================================================
            */

                    ]

                        COLORS.lightBlue,

                        2.2,

                        0.64,

                    points: [

                        { x: 0.23, y: -0.15 },

                        { x: 0.30, y: -0.23 },

                    ]

                },


                {

                        COLORS.blue,

                    width:
                        2.2,

                    start:
                        0.49,

                    end:
                        0.68,

                    points: [

                        { x: 0.37, y: 0.16 },

                        { x: 0.45, y: 0.22 },

                    ]

                }

            ];


            /*
            ============================================================
            PATH UTILITIES
            ============================================================
            */


            function distance(
                a,
                b
            ) {

                return Math.hypot(
                    b.x - a.x,
                    b.y - a.y
                );

            }


            function pathLength(
                points
            ) {

                let total = 0;


                for (
                    let i = 1;
                    i < points.length;
                    i++
                ) {

                    total +=
                        distance(
                            points[i - 1],
                            points[i]
                        );

                }


                return total;

            }


            function partialPath(
                points,
                progress
            ) {

                progress =
                    clamp(progress);


                if (progress <= 0) {
                    return [];
                }


                if (progress >= 1) {
                    return points;
                }


                const total =
                    pathLength(points);


                const target =
                    total * progress;


                const result =
                    [points[0]];


                let drawn =
                    0;


                for (
                    let i = 1;
                    i < points.length;
                    i++
                ) {

                    const a =
                        points[i - 1];


                    const b =
                        points[i];


                    const segment =
                        distance(a, b);


                    if (
                        drawn + segment
                        <=
                        target
                    ) {

                        result.push(b);

                        drawn +=
                            segment;

                    }

                    else {

                        const remaining =
                            target - drawn;


                        const ratio =
                            segment === 0
                                ?
                                0
                                :
                                remaining / segment;


                        result.push({

                            x:
                                lerp(
                                    a.x,
                                    b.x,
                                    ratio
                                ),

                            y:
                                lerp(
                                    a.y,
                                    b.y,
                                    ratio
                                )

                        });


                        break;

                    }

                }


                return result;

            }


            function drawPath(
                points,
                color,
                lineWidth,
                alpha = 1
            ) {

                if (
                    !points
                    ||
                    points.length < 2
                ) {

                    return;

                }


                ctx.save();


                ctx.globalAlpha =
                    alpha;


                ctx.strokeStyle =
                    color;


                ctx.lineWidth =
                    lineWidth;


                ctx.lineCap =
                    "round";


                ctx.lineJoin =
                    "round";


                ctx.beginPath();


                const first =
                    toScreen(points[0]);


                ctx.moveTo(
                    first.x,
                    first.y
                );


                for (
                    let i = 1;
                    i < points.length;
                    i++
                ) {

                    const point =
                        toScreen(
                            points[i]
                        );


                    ctx.lineTo(
                        point.x,
                        point.y
                    );

                }


                ctx.stroke();


                ctx.restore();

            }


            /*
            ============================================================
            BACKGROUND GUIDES
            ============================================================
            */


            function drawGuides() {

                ctx.save();


                ctx.strokeStyle =
                    "rgba(88,166,255,0.045)";


                ctx.lineWidth =
                    1;


                ctx.beginPath();


                ctx.moveTo(
                    width / 2,
                    50
                );


                ctx.lineTo(
                    width / 2,
                    height - 50
                );


                ctx.stroke();


                ctx.beginPath();


                ctx.moveTo(
                    60,
                    height / 2
                );


                ctx.lineTo(
                    width - 60,
                    height / 2
                );


                ctx.stroke();


                ctx.restore();

            }


            /*
            ============================================================
            SEED
            ============================================================
            */


            function drawSeed(
                point,
                alpha = 1
            ) {

                const position =
                    toScreen(point);


                ctx.save();


                ctx.globalAlpha =
                    alpha;


                const glow =
                    ctx.createRadialGradient(
                        position.x,
                        position.y,
                        0,
                        position.x,
                        position.y,
                        36
                    );


                glow.addColorStop(
                    0,
                    "rgba(244,138,75,0.55)"
                );


                glow.addColorStop(
                    1,
                    "rgba(244,138,75,0)"
                );


                ctx.fillStyle =
                    glow;


                ctx.beginPath();


                ctx.arc(
                    position.x,
                    position.y,
                    36,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.fillStyle =
                    COLORS.orange;


                ctx.beginPath();


                ctx.arc(
                    position.x,
                    position.y,
                    12,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.strokeStyle =
                    "rgba(244,138,75,0.65)";


                ctx.lineWidth =
                    2;


                ctx.beginPath();


                ctx.arc(
                    position.x,
                    position.y,
                    20,
                    0,
                    Math.PI * 2
                );


                ctx.stroke();


                ctx.restore();

            }


            /*
            ============================================================
            STRUCTURE DRAWING
            ============================================================
            */


            const ROOT_ANGLE =
                Math.PI / 2;


            function transformBranch(
                branch,
                angle
            ) {

                return branch.points.map(
                    point =>
                        rotatePoint(
                            point,
                            angle
                        )
                );

            }


            function drawGrowingRoot(
                progress
            ) {

                drawSeed(
                    rotatePoint(
                        seed,
                        ROOT_ANGLE
                    )
                );


                branches.forEach(
                    branch => {

                        const local =
                            clamp(
                                (
                                    progress
                                    -
                                    branch.start
                                )
                                /
                                (
                                    branch.end
                                    -
                                    branch.start
                                )
                            );


                        const transformed =
                            transformBranch(
                                branch,
                                ROOT_ANGLE
                            );


                        const visible =
                            partialPath(
                                transformed,
                                easeOut(local)
                            );


                        drawPath(
                            visible,
                            branch.color,
                            branch.width
                        );

                    }
                );

            }


            function drawFullStructure(
                angle,
                alpha = 1
            ) {

                branches.forEach(
                    branch => {

                        drawPath(
                            transformBranch(
                                branch,
                                angle
                            ),
                            branch.color,
                            branch.width,
                            alpha
                        );

                    }
                );

            }


            /*
            ============================================================
            ERASING

            Nothing moves.

            We progressively remove
            complete branches from the
            rear/right side toward
            the front/left.
            ============================================================
            */


            function branchAverageX(
                branch
            ) {

                const total =
                    branch.points.reduce(
                        (
                            sum,
                            point
                        ) =>
                            sum + point.x,
                        0
                    );


                return (
                    total
                    /
                    branch.points.length
                );

            }


            const eraseOrder =
                [...branches]
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            branchAverageX(b)
                            -
                            branchAverageX(a)
                    );


            function drawErasingBrain(
                progress
            ) {

                const numberToErase =
                    Math.floor(
                        progress
                        *
                        eraseOrder.length
                    );


                const erased =
                    new Set(
                        eraseOrder
                            .slice(
                                0,
                                numberToErase
                            )
                    );


                branches.forEach(
                    branch => {

                        if (
                            erased.has(branch)
                        ) {
                            return;
                        }


                        drawPath(
                            branch.points,
                            branch.color,
                            branch.width
                        );

                    }
                );


                /*
                Horizontal medical line begins
                only near the end.
                */


                if (
                    progress > 0.72
                ) {

                    const t =
                        clamp(
                            (
                                progress
                                -
                                0.72
                            )
                            /
                            0.28
                        );


                    drawPath(

                        [

                            {
                                x:
                                    -0.1,

                                y:
                                    0
                            },

                            {
                                x:
                                    lerp(
                                        -0.1,
                                        0.75,
                                        t
                                    ),

                                y:
                                    0
                            }

                        ],

                        COLORS.ecg,

                        4

                    );

                }

            }


            /*
            ============================================================
            ECG
            ============================================================
            */


            const ecgPath = [

                { x: -0.72, y: 0 },

                { x: -0.33, y: 0 },

                { x: -0.20, y: 0 },

                { x: -0.13, y: -0.08 },

                { x: -0.06, y: 0.16 },

                { x: 0.02, y: -0.29 },

                { x: 0.10, y: 0.18 },

                { x: 0.20, y: 0 },

                { x: 0.68, y: 0 }

            ];


            function drawECG(
                progress
            ) {

                const visible =
                    partialPath(
                        ecgPath,
                        progress
                    );


                drawPath(
                    visible,
                    COLORS.ecg,
                    4.5
                );


                if (
                    progress > 0.72
                ) {

                    const heartProgress =
                        clamp(
                            (
                                progress
                                -
                                0.72
                            )
                            /
                            0.28
                        );


                    const center =
                        toScreen({
                            x: 0.55,
                            y: -0.08
                        });


                    const size =
                        42
                        *
                        easeOut(
                            heartProgress
                        );


                    ctx.save();


                    ctx.strokeStyle =
                        "#ff79aa";


                    ctx.lineWidth =
                        4;


                    ctx.lineJoin =
                        "round";


                    ctx.shadowColor =
                        "#ff79aa";


                    ctx.shadowBlur =
                        13;


                    ctx.beginPath();


                    const samples =
                        100;


                    for (
                        let i = 0;
                        i <= samples;
                        i++
                    ) {

                        const a =
                            i
                            /
                            samples
                            *
                            Math.PI
                            *
                            2;


                        const hx =
                            16
                            *
                            Math.pow(
                                Math.sin(a),
                                3
                            );


                        const hy =
                            -(
                                13
                                *
                                Math.cos(a)

                                -

                                5
                                *
                                Math.cos(
                                    2 * a
                                )

                                -

                                2
                                *
                                Math.cos(
                                    3 * a
                                )

                                -

                                Math.cos(
                                    4 * a
                                )
                            );


                        const x =
                            center.x
                            +
                            hx
                            *
                            size
                            /
                            32;


                        const y =
                            center.y
                            +
                            hy
                            *
                            size
                            /
                            32;


                        if (
                            i === 0
                        ) {

                            ctx.moveTo(
                                x,
                                y
                            );

                        }

                        else {

                            ctx.lineTo(
                                x,
                                y
                            );

                        }

                    }


                    ctx.stroke();


                    ctx.restore();

                }

            }


            /*
            ============================================================
            TIMELINE
            ============================================================
            */


            const cycleDuration =
                17000;


            const startTime =
                performance.now();


            function animate(
                currentTime
            ) {

                ctx.clearRect(
                    0,
                    0,
                    width,
                    height
                );


                drawGuides();


                const elapsed =
                    (
                        currentTime
                        -
                        startTime
                    )
                    %
                    cycleDuration;


                const t =
                    elapsed
                    /
                    cycleDuration;


                /*
                ----------------------------------------
                1 — GROW
                ----------------------------------------
                */

                if (
                    t < 0.34
                ) {

                    statusElement.textContent =
                        "Growing";


                    drawGrowingRoot(
                        easeOut(
                            t
                            /
                            0.34
                        )
                    );

                }


                /*
                ----------------------------------------
                2 — HOLD ROOT
                ----------------------------------------
                */

                else if (
                    t < 0.40
                ) {

                    statusElement.textContent =
                        "Root";


                    drawGrowingRoot(
                        1
                    );

                }


                /*
                ----------------------------------------
                3 — ROTATE
                ----------------------------------------
                */

                else if (
                    t < 0.53
                ) {

                    statusElement.textContent =
                        "Rotating";


                    const local =
                        easeInOut(
                            (
                                t
                                -
                                0.40
                            )
                            /
                            0.13
                        );


                    const angle =
                        lerp(
                            ROOT_ANGLE,
                            0,
                            local
                        );


                    drawFullStructure(
                        angle
                    );


                    drawSeed(
                        rotatePoint(
                            seed,
                            angle
                        ),
                        1 - local
                    );

                }


                /*
                ----------------------------------------
                4 — BRAIN
                ----------------------------------------
                */

                else if (
                    t < 0.62
                ) {

                    statusElement.textContent =
                        "Brain";


                    drawFullStructure(
                        0
                    );

                }


                /*
                ----------------------------------------
                5 — ERASE
                ----------------------------------------
                */

                else if (
                    t < 0.80
                ) {

                    statusElement.textContent =
                        "Erasing";


                    drawErasingBrain(
                        easeInOut(
                            (
                                t
                                -
                                0.62
                            )
                            /
                            0.18
                        )
                    );

                }


                /*
                ----------------------------------------
                6 — ECG
                ----------------------------------------
                */

                else {

                    statusElement.textContent =
                        "Pulse";


                    drawECG(
                        easeOut(
                            (
                                t
                                -
                                0.80
                            )
                            /
                            0.20
                        )
                    );

                }


                requestAnimationFrame(
                    animate
                );

            }


            /*
            ============================================================
            IMMEDIATE VISIBILITY TEST

            Draw this BEFORE starting
            requestAnimationFrame.

            If you can see this orange seed,
            JavaScript is definitely running.
            ============================================================
            */


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            drawGuides();


            drawSeed(
                rotatePoint(
                    seed,
                    ROOT_ANGLE
                )
            );


            statusElement.textContent =
                "Running";


            /*
            Start animation.
            */


            requestAnimationFrame(
                animate
            );


        }

        catch (error) {


            console.error(
                error
            );


            statusElement.textContent =
                "Error";


            errorElement.style.display =
                "block";


            errorElement.textContent =
                "Animation error: "
                +
                error.message;

        }

    </script>

</body>

</html>
